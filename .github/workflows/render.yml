# Render video TikTok di runner GitHub. Image ubuntu-24.04 TIDAK bawa ffmpeg
# (run pertama gagal karena itu) → dipasang lewat apt. 4 core dipakai paralel
# oleh render.py. Hasilnya SATU file MP4 di Artifacts.
name: Render TikTok

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'render/**'
      - 'vo/**'
      - 'fonts/**'
      - 'aset/**'
      - '.github/workflows/render.yml'

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # -eo pipefail: kegagalan di tengah pipe nggak ketutup `head`

jobs:
  render:
    # Dua potongan dari naskah + VO yang sama (lihat POTONGAN di render/naskah.py):
    # penuh ~2:30 dan pendek ~1:13 buat FYP. Paralel, artefak terpisah.
    name: Render 720p60 (${{ matrix.potongan }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        potongan: [penuh, pendek]
    env:
      EPS2_POTONGAN: ${{ matrix.potongan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Dependensi (versi dipatok)
        run: pip install --no-cache-dir --disable-pip-version-check 'Pillow==12.3.0' 'numpy==2.5.3'

      - name: ffmpeg (apt, image runner tidak menyertakannya)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1

      - name: Cache aset pihak ketiga (stiker + SFX, kunci = hash manifest)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: aset/cache
          key: aset-${{ hashFiles('aset/manifest.json') }}

      - name: Unduh aset pihak ketiga yang belum ada (sha256 dicek, tidak di-commit)
        run: python3 render/aset.py --unduh

      - name: Timeline + cek semua scene (1 frame / 2 detik, tanpa encode)
        run: |
          python3 render/render.py --info
          python3 render/render.py --cek 2

      - name: Render penuh
        run: python3 render/render.py

      - name: Verifikasi hasil (durasi, resolusi, ada audio)
        run: |
          NAMA=$(python3 -c 'import sys; sys.path.insert(0, "render"); from naskah import NAMA_FILE; print(NAMA_FILE)')
          echo "NAMA=$NAMA" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate:format=duration \
            -of default=noprint_wrappers=1 "keluaran/$NAMA.mp4" | tee probe.txt
          grep -q 'codec_type=audio' probe.txt
          grep -q 'width=720' probe.txt
          grep -q 'height=1280' probe.txt

      - name: Unggah MP4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAMA }}
          path: keluaran/${{ env.NAMA }}.mp4
          if-no-files-found: error
          retention-days: 30
